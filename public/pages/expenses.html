<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses - PayShield B2B Financial Platform</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-container">
    <nav id="appSidebar"></nav>

    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
          <div class="page-title-wrap">
            <h1>Business Expenses</h1>
            <p>Track operating expenditures, operational overhead, and cash outflows</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button onclick="openModal()" class="btn btn-primary btn-sm">+ Add Expense</button>
          <button onclick="exportExpensesCSV()" class="btn btn-outline btn-sm">Export CSV</button>
        </div>
      </header>

      <div class="content-body">
        <div class="card">
          <div style="display: flex; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap;">
            <input type="text" id="searchInput" class="form-control" placeholder="Search expenses..." style="max-width: 320px;" onkeyup="filterExpenses()">
            <select id="categoryFilter" class="form-control" style="max-width: 180px;" onchange="filterExpenses()">
              <option value="">All Categories</option>
              <option value="Office">Office & Rent</option>
              <option value="Travel">Travel & Transport</option>
              <option value="Marketing">Marketing & Ads</option>
              <option value="Utilities">Utilities & Telecom</option>
              <option value="Salaries">Payroll & Contractor</option>
              <option value="Software">Software & Cloud</option>
              <option value="Other">Other Operational</option>
            </select>
          </div>

          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Expense Date</th>
                  <th>Category</th>
                  <th>Description</th>
                  <th>Amount</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="expensesTableBody">
                <tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">Loading expenses...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Expense Modal -->
  <div id="expenseModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Record Expense</h2>
        <button onclick="closeModal()" class="modal-close">&times;</button>
      </div>
      <form id="expenseForm">
        <div class="modal-body">
          <input type="hidden" id="expenseId">
          <div class="form-group">
            <label for="expenseCategory">Category *</label>
            <select id="expenseCategory" class="form-control" required>
              <option value="">Select Category</option>
              <option value="Office">Office & Rent</option>
              <option value="Travel">Travel & Transport</option>
              <option value="Marketing">Marketing & Ads</option>
              <option value="Utilities">Utilities & Telecom</option>
              <option value="Salaries">Payroll & Contractor</option>
              <option value="Software">Software & Cloud</option>
              <option value="Other">Other Operational</option>
            </select>
          </div>
          <div class="form-group">
            <label for="expenseDescription">Description / Vendor *</label>
            <input type="text" id="expenseDescription" class="form-control" required placeholder="e.g. AWS hosting, Office internet">
          </div>
          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="expenseAmount">Amount *</label>
              <input type="number" id="expenseAmount" class="form-control" step="0.01" min="0.01" required placeholder="0.00">
            </div>
            <div class="form-group">
              <label for="expenseCurrency">Currency</label>
              <select id="expenseCurrency" class="form-control">
                <option value="USD">USD</option>
                <option value="KES">KES</option>
                <option value="UGX">UGX</option>
                <option value="TZS">TZS</option>
                <option value="GBP">GBP</option>
                <option value="EUR">EUR</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="expenseDate">Expense Date *</label>
            <input type="date" id="expenseDate" class="form-control" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" onclick="closeModal()" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/dashboard.js"></script>
  <script>
    initAppShell('expenses');

    let allExpenses = [];

    async function loadExpenses() {
      try {
        const result = await apiCall('/expenses');
        allExpenses = result.expenses || [];
        renderExpenses(allExpenses);
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    function renderExpenses(expenses) {
      const tbody = document.getElementById('expensesTableBody');
      if (!expenses || expenses.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">No expenses recorded. Click "Add Expense" to track spending.</td></tr>';
        return;
      }

      tbody.innerHTML = expenses.map(e => `
        <tr>
          <td>${formatDate(e.date)}</td>
          <td><span class="badge badge-info">${e.category}</span></td>
          <td>${e.description}</td>
          <td style="color: var(--danger); font-weight: 700;">-${formatCurrency(e.amount, e.currency)}</td>
          <td>
            <div style="display: flex; gap: 0.35rem;">
              <button onclick="editExpense('${e.id}')" class="btn btn-outline btn-sm">Edit</button>
              <button onclick="deleteExpense('${e.id}')" class="btn btn-danger btn-sm">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function filterExpenses() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categoryFilter').value;

      let filtered = allExpenses;
      if (search) {
        filtered = filtered.filter(e =>
          e.description.toLowerCase().includes(search) ||
          e.category.toLowerCase().includes(search)
        );
      }
      if (cat) {
        filtered = filtered.filter(e => e.category === cat);
      }
      renderExpenses(filtered);
    }

    function openModal(id = null) {
      const modal = document.getElementById('expenseModal');
      const form = document.getElementById('expenseForm');
      form.reset();
      document.getElementById('expenseId').value = '';
      document.getElementById('expenseDate').value = new Date().toISOString().split('T')[0];

      const org = getOrganization();
      if (org?.currency) {
        document.getElementById('expenseCurrency').value = org.currency;
      }

      if (id) {
        document.getElementById('modalTitle').textContent = 'Edit Expense';
        const e = allExpenses.find(x => x.id === id);
        if (e) {
          document.getElementById('expenseId').value = e.id;
          document.getElementById('expenseCategory').value = e.category;
          document.getElementById('expenseDescription').value = e.description;
          document.getElementById('expenseAmount').value = e.amount;
          document.getElementById('expenseCurrency').value = e.currency;
          document.getElementById('expenseDate').value = e.date ? e.date.split('T')[0] : '';
        }
      } else {
        document.getElementById('modalTitle').textContent = 'Record Expense';
      }

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('expenseModal').classList.remove('active');
    }

    async function saveExpense(e) {
      e.preventDefault();
      const id = document.getElementById('expenseId').value;
      const data = {
        category: document.getElementById('expenseCategory').value,
        description: document.getElementById('expenseDescription').value,
        amount: parseFloat(document.getElementById('expenseAmount').value),
        currency: document.getElementById('expenseCurrency').value,
        date: document.getElementById('expenseDate').value,
      };

      try {
        if (id) {
          await apiCall(`/expenses/${id}`, 'PUT', data);
          showToast('Expense updated', 'success');
        } else {
          await apiCall('/expenses', 'POST', data);
          showToast('Expense logged', 'success');
        }
        closeModal();
        loadExpenses();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    function editExpense(id) {
      openModal(id);
    }

    async function deleteExpense(id) {
      if (!confirm('Delete this expense record?')) return;
      try {
        await apiCall(`/expenses/${id}`, 'DELETE');
        showToast('Expense deleted', 'info');
        loadExpenses();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    function exportExpensesCSV() {
      const token = localStorage.getItem('token');
      window.open(`/api/expenses/export?token=${token}`, '_blank');
    }

    document.getElementById('expenseForm').addEventListener('submit', saveExpense);
    loadExpenses();
  </script>
</body>
</html>
