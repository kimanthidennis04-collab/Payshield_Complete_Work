<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotes - PayShield B2B Financial Platform</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-container">
    <nav id="appSidebar"></nav>

    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
          <div class="page-title-wrap">
            <h1>Quotations</h1>
            <p>Generate price estimates, track proposals, and convert into invoices</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button onclick="openModal()" class="btn btn-primary btn-sm">+ Create Quote</button>
        </div>
      </header>

      <div class="content-body">
        <div class="card">
          <div style="display: flex; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap;">
            <input type="text" id="searchInput" class="form-control" placeholder="Search quotes..." style="max-width: 320px;" onkeyup="filterQuotes()">
            <select id="statusFilter" class="form-control" style="max-width: 180px;" onchange="filterQuotes()">
              <option value="">All Statuses</option>
              <option value="DRAFT">Draft</option>
              <option value="SENT">Sent</option>
              <option value="ACCEPTED">Accepted</option>
              <option value="REJECTED">Rejected</option>
              <option value="EXPIRED">Expired</option>
            </select>
          </div>

          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Quote #</th>
                  <th>Client</th>
                  <th>Status</th>
                  <th>Total</th>
                  <th>Valid Until</th>
                  <th>Created Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="quotesTableBody">
                <tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: 2rem;">Loading quotes...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Create / Edit Quote Modal -->
  <div id="quoteModal" class="modal">
    <div class="modal-content" style="max-width: 800px;">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Create Quote</h2>
        <button onclick="closeModal()" class="modal-close">&times;</button>
      </div>
      <form id="quoteForm">
        <div class="modal-body">
          <input type="hidden" id="quoteId">

          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div class="form-group">
              <label for="quoteClient">Client *</label>
              <select id="quoteClient" class="form-control" required>
                <option value="">Select Client</option>
              </select>
            </div>
            <div class="form-group">
              <label for="quoteValidUntil">Valid Until</label>
              <input type="date" id="quoteValidUntil" class="form-control">
            </div>
            <div class="form-group">
              <label for="quoteStatus">Status</label>
              <select id="quoteStatus" class="form-control">
                <option value="DRAFT">Draft</option>
                <option value="SENT">Sent</option>
                <option value="ACCEPTED">Accepted</option>
                <option value="REJECTED">Rejected</option>
                <option value="EXPIRED">Expired</option>
              </select>
            </div>
          </div>

          <!-- Tax Configuration -->
          <div style="background: var(--surface-secondary); padding: 0.85rem 1rem; border-radius: var(--radius-md); margin-bottom: 1rem; display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap;">
            <div>
              <label style="font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 0.25rem;">Pricing Method</label>
              <select id="quotePricingType" class="form-control" style="width: 170px;" onchange="calculateTotals()">
                <option value="EXCLUSIVE">Tax Exclusive (+16%)</option>
                <option value="INCLUSIVE">Tax Inclusive (Included)</option>
              </select>
            </div>
            <div>
              <label style="font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 0.25rem;">VAT / Tax Rate (%)</label>
              <input type="number" id="quoteTaxRatePercent" class="form-control" style="width: 110px;" value="16" min="0" step="0.5" oninput="calculateTotals()">
            </div>
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 1.2rem;">
              <input type="checkbox" id="quoteTaxExempt" onchange="calculateTotals()">
              <label for="quoteTaxExempt" style="margin: 0; font-size: 0.85rem; font-weight: 600;">Tax Exempt (0%)</label>
            </div>
          </div>

          <!-- Line Items -->
          <div class="form-group">
            <label style="display: flex; justify-content: space-between; align-items: center;">
              <span>Quotation Items</span>
              <button type="button" onclick="addItem()" class="btn btn-outline btn-sm">+ Add Item</button>
            </label>
            <div id="quoteItems" style="margin-top: 0.5rem;">
              <!-- Line items dynamic -->
            </div>
          </div>

          <div class="form-group">
            <label for="quoteNotes">Scope of Work & Commercial Terms</label>
            <textarea id="quoteNotes" class="form-control" rows="2" placeholder="Deliverables included, milestones, validity notes..."></textarea>
          </div>

          <!-- Totals Breakdown -->
          <div style="background: var(--surface-secondary); padding: 1rem 1.25rem; border-radius: var(--radius-md); text-align: right; margin-top: 1rem;">
            <div style="font-size: 0.875rem; margin-bottom: 0.25rem;">
              <span style="color: var(--text-muted);">Subtotal: </span>
              <strong id="subtotalDisplay">0.00</strong>
            </div>
            <div style="font-size: 0.875rem; margin-bottom: 0.25rem;">
              <span style="color: var(--text-muted);" id="taxLabel">VAT (16%): </span>
              <strong id="taxDisplay">0.00</strong>
            </div>
            <div style="font-size: 1.15rem; font-weight: 800; color: var(--primary);">
              <span>Total Estimated: </span>
              <span id="totalDisplay">0.00</span>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" onclick="closeModal()" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Quote</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Printable Quotation Modal -->
  <div id="printQuoteModal" class="modal">
    <div class="modal-content" style="max-width: 800px; padding: 2rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;" class="no-print">
        <h3 style="font-size: 1.1rem; font-weight: 700;">Quotation Preview</h3>
        <div style="display: flex; gap: 0.5rem;">
          <button onclick="window.print()" class="btn btn-primary btn-sm">🖨️ Print Quotation</button>
          <button onclick="closePrintQuoteModal()" class="btn btn-outline btn-sm">Close</button>
        </div>
      </div>
      <div id="printableQuoteContainer"></div>
    </div>
  </div>

  <script src="/js/dashboard.js"></script>
  <script>
    initAppShell('quotes');

    let allQuotes = [];
    let allClients = [];

    async function loadQuotes() {
      try {
        const [qRes, cRes] = await Promise.all([
          apiCall('/quotes'),
          apiCall('/clients')
        ]);
        allQuotes = qRes.quotes || [];
        allClients = cRes.clients || [];

        const select = document.getElementById('quoteClient');
        select.innerHTML = '<option value="">Select Client</option>' +
          allClients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

        renderQuotes(allQuotes);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function renderQuotes(quotes) {
      const tbody = document.getElementById('quotesTableBody');
      if (!quotes || quotes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: 2rem;">No quotations found. Click "Create Quote" to begin.</td></tr>';
        return;
      }

      const cur = getOrganization()?.currency || 'USD';

      tbody.innerHTML = quotes.map(q => {
        const client = allClients.find(c => c.id === q.clientId) || q.client;
        const statusClass = q.status === 'ACCEPTED' ? 'badge-success' : q.status === 'REJECTED' ? 'badge-danger' : q.status === 'SENT' ? 'badge-info' : 'badge-warning';

        return `
          <tr>
            <td><strong>${q.quoteNumber}</strong></td>
            <td>${client ? client.name : 'Unknown Client'}</td>
            <td><span class="badge ${statusClass}">${q.status}</span></td>
            <td><strong>${formatCurrency(q.total, cur)}</strong></td>
            <td>${formatDate(q.validUntil)}</td>
            <td>${formatDate(q.createdAt)}</td>
            <td>
              <div style="display: flex; gap: 0.35rem; flex-wrap: wrap;">
                <button onclick="viewQuote('${q.id}')" class="btn btn-outline btn-sm">View</button>
                <button onclick="editQuote('${q.id}')" class="btn btn-outline btn-sm">Edit</button>
                <button onclick="convertToInvoice('${q.id}')" class="btn btn-success btn-sm" title="Convert into an Invoice">Convert to Invoice</button>
                <button onclick="deleteQuote('${q.id}')" class="btn btn-danger btn-sm">Delete</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterQuotes() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;

      let filtered = allQuotes;
      if (search) {
        filtered = filtered.filter(q =>
          q.quoteNumber.toLowerCase().includes(search) ||
          (q.client && q.client.name.toLowerCase().includes(search))
        );
      }
      if (status) {
        filtered = filtered.filter(q => q.status === status);
      }
      renderQuotes(filtered);
    }

    function openModal() {
      const modal = document.getElementById('quoteModal');
      const form = document.getElementById('quoteForm');
      form.reset();
      document.getElementById('quoteId').value = '';
      document.getElementById('modalTitle').textContent = 'Create Quote';
      document.getElementById('quotePricingType').value = 'EXCLUSIVE';
      document.getElementById('quoteTaxRatePercent').value = '16';
      document.getElementById('quoteTaxExempt').checked = false;

      document.getElementById('quoteItems').innerHTML = '';
      addItem();
      calculateTotals();
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('quoteModal').classList.remove('active');
    }

    function addItem(desc = '', qty = 1, price = 0) {
      const container = document.getElementById('quoteItems');
      const row = document.createElement('div');
      row.className = 'quote-item-row';
      row.style.cssText = 'display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 0.5rem; margin-bottom: 0.5rem; align-items: center;';
      
      row.innerHTML = `
        <input type="text" class="form-control item-desc" placeholder="Scope description" value="${desc}" required>
        <input type="number" class="form-control item-qty" placeholder="Qty" value="${qty}" min="0.01" step="any" required>
        <input type="number" class="form-control item-price" placeholder="Price" value="${price}" min="0" step="any" required>
        <input type="text" class="form-control item-total" readonly value="0.00" style="background: var(--surface-secondary); font-weight: 600;">
        <button type="button" onclick="removeItem(this)" class="btn btn-outline btn-sm" style="color: var(--danger);">&times;</button>
      `;

      container.appendChild(row);
      attachItemListeners(row);
      calculateTotals();
    }

    function removeItem(btn) {
      const rows = document.querySelectorAll('.quote-item-row');
      if (rows.length > 1) {
        btn.closest('.quote-item-row').remove();
        calculateTotals();
      } else {
        showToast('Quote must have at least one item', 'info');
      }
    }

    function attachItemListeners(row) {
      const qtyInput = row.querySelector('.item-qty');
      const priceInput = row.querySelector('.item-price');
      const totalInput = row.querySelector('.item-total');

      function updateRow() {
        const q = parseFloat(qtyInput.value) || 0;
        const p = parseFloat(priceInput.value) || 0;
        totalInput.value = (q * p).toFixed(2);
        calculateTotals();
      }

      qtyInput.addEventListener('input', updateRow);
      priceInput.addEventListener('input', updateRow);
      updateRow();
    }

    function calculateTotals() {
      const rows = document.querySelectorAll('.quote-item-row');
      let rawSum = 0;
      rows.forEach(r => {
        const q = parseFloat(r.querySelector('.item-qty').value) || 0;
        const p = parseFloat(r.querySelector('.item-price').value) || 0;
        rawSum += q * p;
      });

      const isExempt = document.getElementById('quoteTaxExempt').checked;
      const taxRate = isExempt ? 0 : ((parseFloat(document.getElementById('quoteTaxRatePercent').value) || 0) / 100);
      const pricingType = document.getElementById('quotePricingType').value;

      let subtotal, tax, total;
      if (isExempt) {
        subtotal = rawSum;
        tax = 0;
        total = rawSum;
        document.getElementById('taxLabel').textContent = 'VAT (Exempt): ';
      } else if (pricingType === 'INCLUSIVE') {
        total = rawSum;
        subtotal = total / (1 + taxRate);
        tax = total - subtotal;
        document.getElementById('taxLabel').textContent = `VAT Included (${(taxRate * 100).toFixed(0)}%): `;
      } else {
        subtotal = rawSum;
        tax = subtotal * taxRate;
        total = subtotal + tax;
        document.getElementById('taxLabel').textContent = `VAT (${(taxRate * 100).toFixed(0)}%): `;
      }

      const cur = getOrganization()?.currency || 'USD';
      document.getElementById('subtotalDisplay').textContent = formatCurrency(subtotal, cur);
      document.getElementById('taxDisplay').textContent = formatCurrency(tax, cur);
      document.getElementById('totalDisplay').textContent = formatCurrency(total, cur);
    }

    // Fully working editQuote function!
    async function editQuote(id) {
      try {
        const res = await apiCall(`/quotes/${id}`);
        const q = res.quote;
        if (!q) return;

        openModal();
        document.getElementById('quoteId').value = q.id;
        document.getElementById('modalTitle').textContent = `Edit Quote ${q.quoteNumber}`;
        document.getElementById('quoteClient').value = q.clientId;
        document.getElementById('quoteStatus').value = q.status;
        if (q.validUntil) {
          document.getElementById('quoteValidUntil').value = q.validUntil.split('T')[0];
        }
        document.getElementById('quoteNotes').value = q.notes || '';

        const container = document.getElementById('quoteItems');
        container.innerHTML = '';
        if (q.items && q.items.length > 0) {
          q.items.forEach(item => {
            addItem(item.description, item.quantity, item.unitPrice);
          });
        } else {
          addItem();
        }

        calculateTotals();
      } catch (err) {
        showToast('Error loading quote: ' + err.message, 'error');
      }
    }

    async function saveQuote(e) {
      e.preventDefault();
      const id = document.getElementById('quoteId').value;
      const items = [];

      document.querySelectorAll('.quote-item-row').forEach(r => {
        items.push({
          description: r.querySelector('.item-desc').value,
          quantity: parseFloat(r.querySelector('.item-qty').value) || 1,
          unitPrice: parseFloat(r.querySelector('.item-price').value) || 0,
        });
      });

      const isExempt = document.getElementById('quoteTaxExempt').checked;
      const taxRate = isExempt ? 0 : ((parseFloat(document.getElementById('quoteTaxRatePercent').value) || 0) / 100);

      const payload = {
        clientId: document.getElementById('quoteClient').value,
        items,
        status: document.getElementById('quoteStatus').value,
        validUntil: document.getElementById('quoteValidUntil').value || null,
        notes: document.getElementById('quoteNotes').value || null,
        taxExempt: isExempt,
        taxRate: taxRate,
        pricingType: document.getElementById('quotePricingType').value,
      };

      try {
        if (id) {
          await apiCall(`/quotes/${id}`, 'PUT', payload);
          showToast('Quote updated', 'success');
        } else {
          await apiCall('/quotes', 'POST', payload);
          showToast('Quote created', 'success');
        }
        closeModal();
        loadQuotes();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function convertToInvoice(id) {
      if (!confirm('Convert this quotation into an active commercial invoice?')) return;
      try {
        const res = await apiCall(`/quotes/${id}/convert-to-invoice`, 'POST');
        showToast(`Converted! Generated Invoice #${res.invoice.invoiceNumber}`, 'success');
        loadQuotes();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deleteQuote(id) {
      if (!confirm('Are you sure you want to delete this quote?')) return;
      try {
        await apiCall(`/quotes/${id}`, 'DELETE');
        showToast('Quote deleted', 'info');
        loadQuotes();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function viewQuote(id) {
      try {
        const res = await apiCall(`/quotes/${id}`);
        const q = res.quote;
        const org = getOrganization() || { name: 'PayShield Business', currency: 'USD' };
        const cur = org.currency || 'USD';

        const container = document.getElementById('printableQuoteContainer');
        container.innerHTML = `
          <div class="invoice-preview-sheet" style="background: white; color: #0f172a; padding: 2rem; border-radius: 8px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #e2e8f0; padding-bottom: 1.5rem; margin-bottom: 1.5rem;">
              <div>
                <div style="font-size: 1.5rem; font-weight: 800; color: #1e293b;">${org.name}</div>
                <div style="font-size: 0.85rem; color: #64748b;">Formal Price Quotation & Deliverable Proposal</div>
              </div>
              <div style="text-align: right;">
                <div style="font-size: 1.25rem; font-weight: 800; color: #2563eb;">${q.quoteNumber}</div>
                <div style="font-size: 0.85rem; color: #64748b;">Issue Date: ${formatDate(q.createdAt)}</div>
                <div style="font-size: 0.85rem; color: #64748b;">Valid Until: ${formatDate(q.validUntil)}</div>
                <span class="badge ${q.status === 'ACCEPTED' ? 'badge-success' : 'badge-warning'}" style="margin-top: 0.5rem;">${q.status}</span>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
              <div>
                <div style="font-size: 0.75rem; text-transform: uppercase; color: #64748b; font-weight: 700; margin-bottom: 0.25rem;">Quotation Prepared For</div>
                <div style="font-weight: 700; font-size: 1.05rem;">${q.client ? q.client.name : 'Valued Client'}</div>
                <div style="color: #64748b; font-size: 0.875rem;">${q.client?.email || ''}</div>
                <div style="color: #64748b; font-size: 0.875rem;">${q.client?.phone || ''}</div>
                <div style="color: #64748b; font-size: 0.875rem;">${q.client?.address || ''}</div>
              </div>
              <div>
                <div style="font-size: 0.75rem; text-transform: uppercase; color: #64748b; font-weight: 700; margin-bottom: 0.25rem;">Issued By</div>
                <div style="font-weight: 700; font-size: 1.05rem;">${org.name}</div>
                <div style="color: #64748b; font-size: 0.875rem;">Operating Currency: ${cur}</div>
                <div style="color: #64748b; font-size: 0.875rem;">Protected with PayShield Escrow Protocol</div>
              </div>
            </div>

            <div style="margin-bottom: 2rem;">
              <table class="table" style="width: 100%; border-collapse: collapse;">
                <thead>
                  <tr style="border-bottom: 2px solid #e2e8f0; text-align: left;">
                    <th style="padding: 0.75rem 0;">Description</th>
                    <th style="padding: 0.75rem 0; text-align: center;">Qty</th>
                    <th style="padding: 0.75rem 0; text-align: right;">Unit Price</th>
                    <th style="padding: 0.75rem 0; text-align: right;">Amount</th>
                  </tr>
                </thead>
                <tbody>
                  ${(q.items || []).map(item => `
                    <tr style="border-bottom: 1px solid #f1f5f9;">
                      <td style="padding: 0.75rem 0;">${item.description}</td>
                      <td style="padding: 0.75rem 0; text-align: center;">${item.quantity}</td>
                      <td style="padding: 0.75rem 0; text-align: right;">${formatCurrency(item.unitPrice, cur)}</td>
                      <td style="padding: 0.75rem 0; text-align: right; font-weight: 600;">${formatCurrency(item.total, cur)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <div style="display: flex; justify-content: flex-end; margin-bottom: 2rem;">
              <div style="width: 280px; background: #f8fafc; padding: 1rem; border-radius: 8px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.35rem; font-size: 0.875rem;">
                  <span>Subtotal:</span>
                  <strong>${formatCurrency(q.subtotal, cur)}</strong>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.875rem; color: #64748b;">
                  <span>Tax (${q.taxRate ? (q.taxRate * 100).toFixed(0) : 0}%):</span>
                  <span>${formatCurrency(q.tax, cur)}</span>
                </div>
                <div style="display: flex; justify-content: space-between; border-top: 2px solid #e2e8f0; padding-top: 0.5rem; font-size: 1.1rem; font-weight: 800; color: #1e293b;">
                  <span>Quotation Total:</span>
                  <span style="color: #2563eb;">${formatCurrency(q.total, cur)}</span>
                </div>
              </div>
            </div>

            ${q.notes ? `
              <div style="border-top: 1px dashed #cbd5e1; padding-top: 1rem; font-size: 0.85rem; color: #64748b;">
                <strong>Terms & Notes:</strong> ${q.notes}
              </div>
            ` : ''}
          </div>
        `;
        document.getElementById('printQuoteModal').classList.add('active');
      } catch (err) {
        showToast('Error loading quotation: ' + err.message, 'error');
      }
    }

    function closePrintQuoteModal() {
      document.getElementById('printQuoteModal').classList.remove('active');
    }

    document.getElementById('quoteForm').addEventListener('submit', saveQuote);
    loadQuotes();
  </script>
</body>
</html>
