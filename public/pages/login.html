<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PayShield</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>PayShield</h1>
        <p>Sign in to your account</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required>
        </div>
        <div style="text-align: right; margin-bottom: 1rem;">
          <a href="#" onclick="showForgotPasswordModal(event)" style="font-size: 0.85rem; color: var(--primary); text-decoration: none;">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
      </form>
      <p style="text-align: center; margin-top: 1rem; color: var(--text-light);">
        Don't have an account? <a href="/signup" style="color: var(--primary);">Sign up</a>
      </p>
      <div id="error" class="alert alert-error" style="display: none;"></div>
      <div id="success" class="alert alert-success" style="display: none; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; padding: 0.75rem; border-radius: 6px; margin-top: 1rem; font-size: 0.9rem;"></div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgotPasswordModal" class="modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: var(--surface); padding: 2rem; border-radius: 8px; max-width: 420px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
      <h3 style="margin-top: 0; margin-bottom: 0.5rem;">Reset Your Password</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.25rem;">Enter your email to receive a password reset token.</p>
      <div id="forgotModalMsg" style="display: none; font-size: 0.85rem; padding: 0.5rem 0.75rem; border-radius: 4px; margin-bottom: 1rem;"></div>
      <form id="forgotPasswordForm">
        <div class="form-group">
          <label for="forgotEmail">Account Email</label>
          <input type="email" id="forgotEmail" class="form-control" required placeholder="you@company.com">
        </div>
        <div id="resetFields" style="display: none; margin-top: 1rem;">
          <div class="form-group">
            <label for="resetTokenInput">Reset Token</label>
            <input type="text" id="resetTokenInput" class="form-control" placeholder="Paste received token">
          </div>
          <div class="form-group">
            <label for="newPasswordInput">New Password (min 8 chars)</label>
            <input type="password" id="newPasswordInput" class="form-control" minlength="8" placeholder="••••••••">
          </div>
        </div>
        <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-outline btn-sm" onclick="closeForgotPasswordModal()">Cancel</button>
          <button type="submit" id="forgotSubmitBtn" class="btn btn-primary btn-sm">Request Reset Token</button>
        </div>
      </form>
    </div>
  </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
